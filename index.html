<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股海拾贝 · Collections</title>
<script>
(function(){var P={warm:['#f4f1e9','#e6dfd2','#efe9dc','#23211b','#6e655a','#8a2b2b','#2b2820','#6a6054','#948b7d','#6f655a'],
white:['#ffffff','#e6e6e6','#f2f2f2','#1a1a1a','#555555','#e03131','#262626','#57534c','#8a8478','#555555'],
cool:['#f1f4f5','#dde3e6','#eef2f3','#21272a','#5f6a6e','#8a2b2b','#2a2f31','#5b6366','#838d90','#6a7376'],
dark:['#16181d','#2c2f36','#21242b','#e7e7e3','#9aa0a6','#ff6b6b','#c9c9c4','#9a9a95','#80868b','#b8b0a4']};
var k='warm';try{k=localStorage.getItem('xz-pal')||'warm';}catch(_){}
var v=P[k]||P.warm,s=document.documentElement.style;
s.setProperty('--paper',v[0]);s.setProperty('--rule',v[1]);s.setProperty('--rule2',v[2]);
s.setProperty('--ink',v[3]);s.setProperty('--muted',v[4]);s.setProperty('--accent',v[5]);
s.setProperty('--cmt',v[6]);s.setProperty('--sub',v[7]);s.setProperty('--mirror',v[8]);s.setProperty('--btn',v[9]);})();
</script>
<style>
:root{--paper:#f4f1e9;--rule:#e6dfd2;--rule2:#efe9dc;--ink:#23211b;--muted:#6e655a;--accent:#8a2b2b;
--cmt:#2b2820;--sub:#6a6054;--mirror:#948b7d;--btn:#6f655a;}
*{box-sizing:border-box;}html,body{margin:0;}
body{background:radial-gradient(125% 95% at 50% -8%,var(--rule2),var(--paper) 64%);color:var(--ink);min-height:100vh;overflow-x:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;
display:flex;flex-direction:column;align-items:center;padding:clamp(36px,6vw,72px) 20px 72px;}
.wrap{width:100%;max-width:1180px;text-align:center;}
.kicker{font-size:11px;letter-spacing:.46em;text-transform:uppercase;color:var(--mirror);padding-left:.46em;margin-bottom:20px;}
h1{margin:0;font-family:"Songti SC","Noto Serif SC","SimSun",Georgia,serif;font-size:clamp(42px,9vw,72px);letter-spacing:.14em;font-weight:700;}
.title-rule{height:2px;width:0;background:var(--accent);margin:22px auto 0;animation:draw 1s ease .35s forwards;}
@keyframes draw{to{width:120px;}}
.tag{margin:22px auto 0;max-width:30em;color:var(--muted);font-size:14px;line-height:1.95;}
.pal{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:28px;}
.pal-l{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-right:2px;}
.dot{width:22px;height:22px;border-radius:50%;cursor:pointer;-webkit-appearance:none;appearance:none;
border:1px solid var(--rule);box-shadow:inset 0 0 0 2px var(--paper);padding:0;transition:.15s;}
.dot:hover{transform:scale(1.08);}.dot.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--paper),0 0 0 1px var(--accent);}

.sky{position:relative;display:flex;align-items:center;justify-content:center;
min-height:clamp(440px,62vw,560px);margin-top:clamp(26px,5vw,46px);}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.stars i{position:absolute;border-radius:50%;background:var(--ink);opacity:.16;animation:tw 5s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.10}50%{opacity:.42}}
@media(prefers-reduced-motion:reduce){.stars i{animation:none;opacity:.22;}}

.orbit{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-start;
--d:clamp(112px,15vw,152px);
gap:clamp(28px,8vw,118px);flex-wrap:wrap;padding:0;}
.orbit::before{content:'';position:absolute;top:calc(var(--d)/2);left:10%;right:10%;
height:0;border-top:1px dashed var(--rule);z-index:0;opacity:.7;}
@media(max-width:620px){.orbit::before{display:none;}.orbit{align-items:center;row-gap:46px;}}
.orb-item{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px;
text-decoration:none;color:inherit;opacity:0;transform:translateY(22px) scale(.96);
animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:calc(var(--i,0)*.18s + .3s);}
.o2{margin-top:40px;}
@media(max-width:620px){.o2{margin-top:0;}}
.orb{width:var(--d);height:var(--d);border-radius:50%;
background:radial-gradient(circle at 33% 27%,color-mix(in srgb,var(--c) 56%,#fff),var(--c) 52%,color-mix(in srgb,var(--c) 68%,#000) 100%);
box-shadow:0 16px 40px -12px var(--c),inset 0 0 30px rgba(255,255,255,.22),inset 0 -14px 30px rgba(0,0,0,.20);
display:flex;align-items:center;justify-content:center;
animation:float 6.5s ease-in-out infinite;transition:box-shadow .3s,transform .3s;}
.orb:hover{box-shadow:0 26px 58px -10px var(--c),inset 0 0 30px rgba(255,255,255,.30),inset 0 -14px 30px rgba(0,0,0,.20);transform:translateY(-4px);}
.orb-item:nth-child(1) .orb{animation-delay:0s;}
.orb-item:nth-child(2) .orb{animation-delay:-2.2s;}
.orb-item:nth-child(3) .orb{animation-delay:-4.4s;}
.g{font-family:"Songti SC","Noto Serif SC","SimSun",serif;font-size:clamp(26px,3.8vw,34px);color:#fff;line-height:1;letter-spacing:.06em;text-shadow:0 1px 4px rgba(0,0,0,.30);}
.olabel{max-width:12em;text-align:center;}
.ot{display:block;font-family:"Songti SC","Noto Serif SC","SimSun",Georgia,serif;font-size:15px;font-weight:700;letter-spacing:.02em;line-height:1.4;}
.os{display:block;font-size:11.5px;color:var(--c);margin-top:6px;letter-spacing:.05em;}
.foot{margin-top:clamp(50px,8vw,70px);font-size:11px;color:var(--mirror);line-height:1.9;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes rise{to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.orb{animation:none;}.orb-item{animation:none;opacity:1;transform:none;}.title-rule{animation:none;width:120px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Collections · 私人收藏</div>
  <h1>股海拾贝</h1>
  <div class="title-rule"></div>
  <p class="tag">从信息的海里，打捞值得长期反复读的东西。<br>每一颗星，是一处可以随时回去的世界。</p>
  <div class="pal">
    <span class="pal-l">底色</span>
    <button class="dot" data-pal="warm"></button><button class="dot" data-pal="white"></button>
    <button class="dot" data-pal="cool"></button><button class="dot" data-pal="dark"></button>
  </div>

  <div class="sky">
    <div class="stars" id="stars"></div>
    <div class="orbit" id="orbit"></div>
  </div>
  <div class="foot">新增收藏：把离线归档 HTML 放进本目录，再在 COLLECTIONS 数组加一项，就会多亮一颗星。</div>
</div>
<script>
var COLLECTIONS=[
 {file:'weibo-xupangzi.html',glyph:'徐胖',color:'#8a2b2b',title:'不会游泳的徐胖子',sub:'微博 · 23 篇'},
 {file:'xueqiu-touzi.html',glyph:'投资',color:'#2f5d57',title:'我如何管理自己的投资',sub:'阿兰同学 · 雪球 · 5 篇'},
 {file:'xueqiu-mingri.html',glyph:'明日',color:'#9a6b3f',title:'明日的世界',sub:'阿兰同学 · 雪球 · 7 篇'}];
var PALS={warm:{paper:'#f4f1e9',rule:'#e6dfd2',rule2:'#efe9dc',ink:'#23211b',muted:'#6e655a',accent:'#8a2b2b',cmt:'#2b2820',sub:'#6a6054',mirror:'#948b7d',btn:'#6f655a'},
white:{paper:'#ffffff',rule:'#e6e6e6',rule2:'#f2f2f2',ink:'#1a1a1a',muted:'#555555',accent:'#e03131',cmt:'#262626',sub:'#57534c',mirror:'#8a8478',btn:'#555555'},
cool:{paper:'#f1f4f5',rule:'#dde3e6',rule2:'#eef2f3',ink:'#21272a',muted:'#5f6a6e',accent:'#8a2b2b',cmt:'#2a2f31',sub:'#5b6366',mirror:'#838d90',btn:'#6a7376'},
dark:{paper:'#16181d',rule:'#2c2f36',rule2:'#21242b',ink:'#e7e7e3',muted:'#9aa0a6',accent:'#ff6b6b',cmt:'#c9c9c4',sub:'#9a9a95',mirror:'#80868b',btn:'#b8b0a4'}};
function setPal(k){var c=PALS[k]||PALS.warm,s=document.documentElement.style;
['paper','rule','rule2','ink','muted','accent','cmt','sub','mirror','btn'].forEach(function(n){s.setProperty('--'+n,c[n]);});
document.querySelectorAll('.dot').forEach(function(b){b.classList.toggle('on',b.dataset.pal===k);});
try{localStorage.setItem('xz-pal',k);}catch(_){}}
document.querySelectorAll('.dot').forEach(function(b){b.onclick=function(){setPal(b.dataset.pal);};});
(function(){var k='warm';try{k=localStorage.getItem('xz-pal')||'warm';}catch(_){}setPal(k);})();
var stars=document.getElementById('stars'),sh='';
for(var i=0;i<46;i++){var s=2+Math.random()*3;sh+='<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)+
'%;width:'+s.toFixed(1)+'px;height:'+s.toFixed(1)+'px;animation-delay:'+(Math.random()*5).toFixed(2)+'s"></i>';}
stars.innerHTML=sh;
var orbit=document.getElementById('orbit');
orbit.innerHTML=COLLECTIONS.map(function(c,i){
 return '<a class="orb-item o'+(i+1)+'" style="--i:'+i+';--c:'+c.color+'" href="'+c.file+'">'+
 '<span class="orb"><span class="g">'+c.glyph+'</span></span>'+
 '<span class="olabel"><span class="ot">'+c.title+'</span><span class="os">'+c.sub+'</span></span></a>';
}).join('');
</script>
</body>
</html>
